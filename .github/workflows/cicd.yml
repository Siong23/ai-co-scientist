name: AI-Co-Scientist CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  ci:

    runs-on:
      - self-hosted

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint (optional)
        run: |
          pip install ruff
          ruff check .
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest --ignore=tests/test_release_process.py

  deploy:

    needs: ci

    if: github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted

    steps:

      - name: Update local repository
        run: |
          cd /home/server2/ai-co-scientist          
          git pull origin main

      - name: Install/update dependencies
        run: |
          cd /home/server2/ai-co-scientist
          ./venv/bin/pip install -r requirements.txt || pip install -r requirements.txt

      - name: Restart AI Co-Scientist
        run: |
          sudo systemctl restart ai-co-scientist.service

      - name: Verify service
        run: |
          sleep 3
          systemctl status ai-co-scientist.service --no-pager
