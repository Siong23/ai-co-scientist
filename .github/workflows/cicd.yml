name: AI-Co-Scientist CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  ci:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Lint (optional)
        run: |
          pip install ruff
          ruff check .
        continue-on-error: true

      - name: Run unit tests
        run: |
          pytest --ignore=tests/test_release_process.py
