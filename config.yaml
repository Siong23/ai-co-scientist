# Provider credentials must come only from environment variables; see
# .env.example. Never place API keys in this file.

# OpenRouter API Base URL
openrouter_base_url: "https://openrouter.ai/api/v1"

# Override this per machine with LMSTUDIO_BASE_URL in .env. Keeping a private
# network address here makes local and deployed checkouts fail unpredictably.
lmstudio_base_url: "http://127.0.0.1:1234/v1"

# LLM Model. Use a compact free default so the public Hugging Face demo can
# finish a full multi-call cycle within its UI timeout. If this one is delisted,
# rate-limited, or too slow, call_llm auto-falls back to other live free models.

llm_model: "qwen/qwen3.5-9b"
# Dedicated model for generating executable PyTorch experiments.
code_generation_model: "qwen/qwen3.5-9b"
# query_rewrite_model: "qwen/qwen3.6-35b-a3b"
query_rewrite_model: "qwen/qwen3.5-9b"


# Number of hypotheses to generate
num_hypotheses: 4

# Per-provider request timeout. Keeps slow free endpoints from consuming the
# whole Gradio cycle budget before fallback can try another model.
llm_request_timeout_seconds: 300
# Fail quickly when the configured LM Studio host cannot be reached while still
# allowing long model inference reads up to llm_request_timeout_seconds.
lmstudio_connect_timeout_seconds: 10

# Absorb a transient LM Studio inference-engine 5xx without changing endpoints
# or losing the native API's explicit reasoning control.
lmstudio_native_server_error_retries: 1
lmstudio_native_retry_backoff_seconds: 1.0

# Prevent reasoning-capable local models from consuming the entire context
# window when a prompt requests a small structured response.
llm_default_max_tokens: 2048
llm_max_tokens:
  research_planning: 2400
  query_rewriting: 1600
  relevance_grading: 512
  coverage_grading: 1024
  literature_synthesis: 1800
  generation: 3072
  format_repair: 2048
  hypothesis_audit: 3072
  evolution: 2048
  supervisor_planning: 1600
  # Leave context headroom for the generation prompt and system instructions.
  code_generation: 8000

# The Evolution agent follows a rotating library of refinement strategies.
# It creates new tournament candidates and never overwrites top-ranked parents.
evolution:
  strategies:
    - combination
    - feasibility
    - simplification
    - grounding
    - inspiration
    - out_of_box
  max_candidates_per_cycle: 3
  # Independent evolution strategies are submitted together to reduce wall time.
  max_workers: 3
  # Retry once only when a syntactically valid child fails the Evolution
  # quality gate (near-copy, multiple hypotheses, or stitched combination).
  quality_repair_attempts: 1
  # Retry transient provider errors or empty responses before abandoning a
  # scientific evolution strategy.
  transport_retry_attempts: 2

# Independent per-hypothesis work is safe to batch in LM Studio. Keep this
# bounded: large local models still need KV-cache memory for every live request.
agent_parallelism:
  generation_grading_workers: 2
  reflection_workers: 3
  evolution_workers: 3

# Elo K-factor
elo_k_factor: 32

# Dedicated ranking model. Set to null or remove to use the main llm_model for
# pairwise tournament debates. A smaller, faster model reduces latency when many
# comparisons run in parallel.
# ranking_llm_model: "qwen/qwen3.6-35b-a3b"
ranking_llm_model: null

ranking:
  proximity_guided_matching: true
  # Bound tournament latency: prioritize nearby Elo/proximity competitors
  # instead of comparing every possible pair in one cycle.
  max_matches_per_cycle: 4

# Hypothesis reviews are independent and can be scheduled together instead of
# blocking one another serially. Tune this to the local server's capacity.
reflection:
  max_workers: 3

# Synthesize actual review/debate feedback using the selected research model.
# Invalid or unavailable model output falls back to deterministic summaries.
meta_review:
  llm_enabled: true

# The production UI uses the dynamic Supervisor. The heuristic planner keeps
# orchestration deterministic and avoids an extra LLM request per workflow
# step; set planner_mode to auto to enable LLM planning with safe fallback.
supervisor:
  mode: "dynamic"
  planner_mode: "heuristic"
  max_steps: 10
  # A Cycle produces one requested batch. Re-running the full literature and
  # generation pipeline inside that Cycle can multiply runtime without bound.
  max_generation_steps_per_cycle: 1
  convergence:
    min_snapshots: 2
    top_elo_delta: 2.0
    max_ranking_batches_before_evolution: 2
  finalization:
    min_accepted_hypotheses: 2
    min_completed_matches: 1
    require_evidence: true
    min_overall_confidence: 5.0
    min_claim_confidence: 4.0
    min_audit_score: 70.0
    require_successful_evolution: true
    min_hypothesis_clusters: 2

# Keep evidence-directed autonomous research, but bound its nested loop. The
# outer Supervisor already performs iterative reflection and evolution, so
# four inner research loops duplicate expensive work before any result appears.
agentic_research:
  enabled: true
  max_steps: 1
  max_queries_per_step: 2
  max_assumptions: 4
  max_evidence_sources: 12

# Top K hypotheses for evolution
top_k_hypotheses: 2

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
logging_level: "INFO"

# Base log file name (without extension)
log_file_name: "app"

# FastAPI host
fastapi_host: "0.0.0.0"

# FastAPI port
fastapi_port: 8000

# Temperature settings for each step
step_temperatures:
  generation: 0.7
  reflection: 0.5

# Shared embedding model used by proximity analysis and RAG retrieval.
# sentence_transformer_model: "all-MiniLM-L6-v2"
use_lmstudio_embeddings: true
# Loading chat and embedding models concurrently can make memory-constrained
# LM Studio servers unload one model while the other request is still active.
serialize_lmstudio_model_calls: true
sentence_transformer_model: "text-embedding-qwen3-embedding-8b"

rag:
  # Maximum rewritten/corrective queries per retrieval round. The planner uses
  # a dynamic 3-5 queries for hypothesis-guided retrieval and avoids padding.
  query_count: 5
  results_per_query: 20
  top_k: 10
  minimum_relevant_sources: 1
  corrective_retrieval_rounds: 2
  # The post-generation Novelty Auditor now performs one targeted critique per
  # hypothesis. Keep the older generic debate disabled to avoid three extra
  # large-model calls that repeat the same review work.
  generation_debate_rounds: 0
  # Audits revise candidates and enforce grounding/citation safety. Composite
  # quality and novelty scores are advisory because later stages already
  # reflect on and rank viable hypotheses.
  hypothesis_audit_enabled: true
  # balanced: reject only structurally invalid or severely ungrounded outputs;
  # keep novelty, wording, and unsupported-target concerns as review warnings.
  # strict: unsupported claims/numbers are hard failures and grounding scores
  # must be at least 5/10. Set hypothesis_audit_enabled false to bypass auditing.
  hypothesis_audit_mode: balanced
  rrf_k: 60
  max_abstract_chars: 4000
  # Relevance and coverage grading need titles plus concise abstracts, not the
  # full generation context. These limits leave output headroom in LM Studio.
  max_grading_abstract_chars: 1600
  max_grading_context_chars: 24000
  # Reject query rewrites and provisional retrieval hypotheses that drift from
  # the original goal or their verbatim requirement anchors. Validation uses
  # one local embedding batch and retries query rewriting once on failure.
  query_fidelity_enabled: true
  query_fidelity_min_similarity: 0.35
  provisional_hypothesis_min_similarity: 0.30

# Only papers retained by abstract-level candidate filtering are downloaded.
# Prompt size remains independently bounded by evidence passage retrieval.
paper_library:
  enabled: true
  # Academic sources may be used for generation only after their full text is
  # persisted in ChromaDB. Retrieved web-page content is already usable evidence
  # and does not require a PDF; web-discovered PDFs may still be indexed.
  require_indexed_sources_for_generation: true
  minimum_downloadable_sources: 2
  persist_directory: "chroma_db"
  pdf_directory: "app/paper"
  collection_name: "research_papers"
  # Schema 3 stores source-faithful raw text separately from intrinsic-context
  # retrieval text and records structured scientific-document provenance.
  index_schema_version: "3"
  parser_backend: "pypdf"
  parser_version: "pypdf-structured-2"
  chunking_version: "section-paragraph-sentence-3"
  retrieval_template_version: "intrinsic-context-1"
  candidate_download_limit: 8
  # Each explicit evidence requirement gets bounded candidate failover within
  # the global per-enrichment acquisition budget.
  per_requirement_acquisition_limit: 2
  max_pages_per_paper: 60
  max_chunks_per_paper: 96
  chunk_size_chars: 2400
  chunk_overlap_chars: 300
  top_k_chunks: 12
  # Dense and BM25 search each retrieve a broader passage pool. Their rankings
  # are fused with passage-level RRF before cross-query requirement reservation.
  hybrid_retrieval_enabled: true
  lexical_retrieval_enabled: true
  dense_candidate_factor: 3
  lexical_candidate_factor: 3
  passage_rrf_k: 60
  query_rrf_k: 60
  bm25_k1: 1.5
  bm25_b: 0.75
  # Selected chunks may add linked siblings from the same source/parent. Added
  # context is separately bounded and the total still obeys max_prompt_chars.
  context_expansion_enabled: true
  context_neighbor_window: 1
  context_parent_chunk_limit: 2
  context_expansion_max_chars: 4000
  max_prompt_chars: 14000
  max_pdf_bytes: 25000000
  download_timeout_seconds: 30
  # Independent evidence queries overlap; indexing/writes remain sequential.
  retrieval_workers: 3
  allowed_pdf_hosts:
    - "arxiv.org"
    - "www.arxiv.org"
    - "export.arxiv.org"
    - "pdfs.semanticscholar.org"
    - "link.springer.com"
    - "api.springernature.com"
    # Nature Research journals use www.nature.com for PDF downloads.
    - "www.nature.com"
    - "nature.com"
    # Direct scholarly PDFs observed through supplementary web search.
    # Keep this as an explicit host allowlist so web results cannot trigger
    # downloads from arbitrary or internal network locations.
    - "dspace.networks.imdea.org"
    - "ieeexplore.ieee.org"
    - "inss.egr.msu.edu"
    - "paper.ijcsns.org"
    - "www.tdx.cat"

evidence_retrieval:
  max_queries: 8
  # Reuse document embeddings across corrective retrieval rounds in a session.
  embedding_cache_size: 512
  # Query instructions apply only on the query side; indexed passages remain
  # unchanged. Disable for embedding models that do not use instructions.
  query_instruction_enabled: true
  query_instruction: >-
    Given a scientific research question, retrieve passages that provide direct
    experimental, methodological, quantitative, comparison, limitation, or
    prior-art evidence.

validation:
  numeric_grounding_enabled: true
  entailment_validation_enabled: true
  audit_max_evidence_chars: 9000

# Semantic Scholar academic search. It first receives the original research goal,
# then participates in expanded-query retrieval when direct retrieval is insufficient.
# Set SEMANTIC_SCHOLAR_API_KEY in .env for higher rate limits (optional).
semantic_scholar:
  enabled: true
  results_per_query: 10

# Springer Nature academic search (Open Access & Meta API). It follows the same
# retrieval sequence when its API key is configured.
# Set SPRINGER_API_KEY (or SPRINGER_OPEN_ACCESS_API_KEY / SPRINGER_META_API_KEY) in .env to enable.
springer:
  enabled: true
  results_per_query: 10

elsevier:
  enabled: true
  results_per_query: 10

tavily:
  enabled: true
  results_per_query: 10
  # The original research goal is searched against academic providers first.
  # Tavily joins expanded/corrective retrieval when that academic evidence is
  # absent or fails the evidence-coverage check.
  # Search first returns URLs plus bounded relevance snippets for local reranking.
  # Only the top URLs are then sent to Extract and admitted as web evidence.
  search_depth: "advanced"
  search_chunks_per_source: 3
  max_extract_results: 5
  extract_depth: "basic"
  extract_chunks_per_source: 3
  # Extracted passages are reranked locally against their assigned sub-question.
  max_evidence_chunks: 8
  max_chunk_chars: 1600

