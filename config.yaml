# Local LM Studio OpenAI-compatible API. Environment variables override these
# defaults; see .env.example. API keys must only be provided through the
# environment and must never be added to this file.
lmstudio_base_url: "http://127.0.0.1:1234/v1"

# Default local model. The UI discovers all model IDs currently exposed by
# LM Studio and allows selecting another model at runtime.
llm_model: "qwen/qwen3.6-35b-a3b"

# Number of hypotheses to generate
num_hypotheses: 4

# LM Studio request timeouts.
llm_request_timeout_seconds: 180
lmstudio_model_list_timeout_seconds: 10

# Elo K-factor
elo_k_factor: 32

# Top K hypotheses for evolution
top_k_hypotheses: 2

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
logging_level: "INFO"

# Base log file name (without extension)
log_file_name: "app"

# FastAPI host
fastapi_host: "0.0.0.0"

# FastAPI port
fastapi_port: 8000

# Temperature settings for each step
step_temperatures:
  generation: 0.7
  reflection: 0.5
