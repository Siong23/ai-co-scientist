# Provider credentials must come only from environment variables; see
# .env.example. Never place API keys in this file.

# OpenRouter API Base URL
openrouter_base_url: "https://openrouter.ai/api/v1"

# lmstudio_base_url: "http://127.0.0.1:1234/v1"
lmstudio_base_url: "http://100.117.90.5:1234/v1"

# LLM Model. Use a compact free default so the public Hugging Face demo can
# finish a full multi-call cycle within its UI timeout. If this one is delisted,
# rate-limited, or too slow, call_llm auto-falls back to other live free models.
# llm_model: "meta-llama/llama-3.2-3b-instruct:free"
# llm_model: "deepseek-ai_deepseek-r1-0528-qwen3-8b"
llm_model: "qwen/qwen3.6-35b-a3b"

# Number of hypotheses to generate
num_hypotheses: 4

# Per-provider request timeout. Keeps slow free endpoints from consuming the
# whole Gradio cycle budget before fallback can try another model.
llm_request_timeout_seconds: 180

# Elo K-factor
elo_k_factor: 32

# Top K hypotheses for evolution
top_k_hypotheses: 2

# Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
logging_level: "INFO"

# Base log file name (without extension)
log_file_name: "app"

# FastAPI host
fastapi_host: "0.0.0.0"

# FastAPI port
fastapi_port: 8000

# Temperature settings for each step
step_temperatures:
  generation: 0.7
  reflection: 0.5

# Shared embedding model used by proximity analysis and RAG retrieval.
sentence_transformer_model: "all-MiniLM-L6-v2"

rag:
  query_count: 5
  results_per_query: 6
  top_k: 4
  minimum_relevant_sources: 1
  corrective_retrieval_rounds: 2
  generation_debate_rounds: 3
  rrf_k: 60
  max_abstract_chars: 1800
